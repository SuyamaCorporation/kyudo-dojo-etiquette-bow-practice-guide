<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弓道 道場礼法・行射工程ガイド</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .tab-active { border-bottom: 3px solid #1e3a5f; color: #1e3a5f; font-weight: 700; }
  .tab-inactive { color: #6b7280; border-bottom: 3px solid transparent; }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chevron { transform: rotate(180deg); }
  .chevron { transition: transform 0.2s; display: inline-block; }
  .step-check:checked + label { text-decoration: line-through; color: #9ca3af; }
  .grade-row:nth-child(odd) { background-color: #f8fafc; }
</style>

<body class="bg-gray-50 min-h-screen">

<header class="bg-blue-950 text-white py-4 px-4 shadow-md">

</header>

        <ol class="space-y-2" id="zarei-list"></ol>
      </fieldset>
    </div>

    <!-- 道場入退出 -->

        <ol class="space-y-2" id="dojo-list"></ol>

</main>

// ===== ローカルストレージキー =====
const LS_REIHOH = 'kyudo-reihoh-checks';
const LS_SHAHHO = 'kyudo-shahho-checks';
const LS_SHINSAI = 'kyudo-shinsai-checks';

function loadChecks(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; }
}
function saveChecks(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); } catch {}
}

// ===== チェックリスト構築 =====
function buildCheckList(containerId, steps, storageKey, prefix) {
  const container = document.getElementById(containerId);
  const saved = loadChecks(storageKey);

  steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'flex items-start gap-2';

    const id = `${prefix}-${i}`;
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = id;
    checkbox.className = 'step-check mt-0.5 w-4 h-4 accent-blue-700 flex-shrink-0';
    checkbox.checked = saved[id] === true;

    const label = document.createElement('label');
    label.htmlFor = id;
    label.className = 'text-sm text-gray-700 cursor-pointer';
    if (checkbox.checked) label.style.textDecoration = 'line-through';

    const num = document.createElement('span');
    num.className = 'font-bold text-blue-700 mr-1';
    num.textContent = (i + 1) + '.';
    label.appendChild(num);
    label.appendChild(document.createTextNode(step));

    checkbox.addEventListener('change', () => {
      const checks = loadChecks(storageKey);
      checks[id] = checkbox.checked;
      saveChecks(storageKey, checks);
      label.style.textDecoration = checkbox.checked ? 'line-through' : '';
    });

    li.appendChild(checkbox);
    li.appendChild(label);
    container.appendChild(li);
  });
}

// ===== 射法八節 =====
function buildShahho() {
  const container = document.getElementById('shahho-list');
  const saved = loadChecks(LS_SHAHHO);

  SHAHHO_STEPS.forEach(step => {
    const article = document.createElement('article');
    article.className = 'bg-white rounded-xl shadow-sm overflow-hidden';

    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.className = 'flex items-center gap-3 p-4 cursor-pointer hover:bg-blue-50 transition';

    const numBadge = document.createElement('span');
    numBadge.className = 'bg-blue-950 text-white text-xs font-bold px-2 py-1 rounded-full flex-shrink-0';
    numBadge.textContent = step.num;

    const nameDiv = document.createElement('div');
    nameDiv.className = 'flex-1';
    const h3 = document.createElement('h3');
    h3.className = 'font-bold text-blue-950';
    h3.textContent = step.name;
    const yomi = document.createElement('span');
    yomi.className = 'text-xs text-gray-500 ml-1';
    yomi.textContent = '（' + step.yomi + '）';
    h3.appendChild(yomi);
    nameDiv.appendChild(h3);

    const chevron = document.createElement('span');
    chevron.className = 'chevron text-gray-400 text-sm';
    chevron.setAttribute('aria-hidden', 'true');
    chevron.textContent = '▼';

    summary.appendChild(numBadge);
    summary.appendChild(nameDiv);
    summary.appendChild(chevron);
    details.appendChild(summary);

    // 詳細コンテンツ
    const body = document.createElement('div');
    body.className = 'px-4 pb-4 border-t border-gray-100';

    const descP = document.createElement('p');
    descP.className = 'text-sm text-gray-700 mt-3';
    descP.textContent = step.desc;
    body.appendChild(descP);

    const mistakeDiv = document.createElement('div');
    mistakeDiv.className = 'mt-3 bg-red-50 rounded-lg p-3';
    const mistakeH = document.createElement('p');
    mistakeH.className = 'text-xs font-bold text-red-700 mb-1';
    mistakeH.textContent = '❌ よくある間違い';
    const mistakeText = document.createElement('p');
    mistakeText.className = 'text-xs text-red-600 whitespace-pre-line';
    mistakeText.textContent = step.mistakes;
    mistakeDiv.appendChild(mistakeH);
    mistakeDiv.appendChild(mistakeText);
    body.appendChild(mistakeDiv);

    const checksDiv = document.createElement('div');
    checksDiv.className = 'mt-3';
    const checksH = document.createElement('p');
    checksH.className = 'text-xs font-bold text-green-700 mb-2';
    checksH.textContent = '✅ チェックポイント';
    checksDiv.appendChild(checksH);

    const fieldset = document.createElement('fieldset');
    const legend = document.createElement('legend');
    legend.className = 'sr-only';
    legend.textContent = step.name + 'の練習チェックリスト';
    fieldset.appendChild(legend);

    step.checks.forEach((check, ci) => {
      const li = document.createElement('div');
      li.className = 'flex items-start gap-2 mb-1';
      const id = `shahho-${step.num}-${ci}`;
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = id;
      cb.className = 'w-4 h-4 accent-green-700 mt-0.5 flex-shrink-0';
      cb.checked = saved[id] === true;

      const lbl = document.createElement('label');
      lbl.htmlFor = id;
      lbl.className = 'text-sm text-gray-700 cursor-pointer';
      if (cb.checked) lbl.style.textDecoration = 'line-through';
      lbl.textContent = check;

      cb.addEventListener('change', () => {
        const s = loadChecks(LS_SHAHHO);
        s[id] = cb.checked;
        saveChecks(LS_SHAHHO, s);
        lbl.style.textDecoration = cb.checked ? 'line-through' : '';
      });

      li.appendChild(cb);
      li.appendChild(lbl);
      fieldset.appendChild(li);
    });
    checksDiv.appendChild(fieldset);
    body.appendChild(checksDiv);
    details.appendChild(body);
    article.appendChild(details);
    container.appendChild(article);
  });
}

// ===== 審査基準 =====
function buildGradeTable() {

  GRADES.forEach((g, i) => {
    const tr = document.createElement('tr');
    tr.className = 'grade-row border-t border-gray-200';

    const tdGrade = document.createElement('td');
    tdGrade.className = 'p-3 font-bold text-blue-950 whitespace-nowrap';
    tdGrade.textContent = g.grade;

    const tdReq = document.createElement('td');
    tdReq.className = 'p-3 text-xs text-gray-700';
    tdReq.textContent = g.requirement;

    const tdExam = document.createElement('td');
    tdExam.className = 'p-3 text-xs text-gray-700';
    tdExam.textContent = g.exam;

    tr.appendChild(tdGrade);
    tr.appendChild(tdReq);
    tr.appendChild(tdExam);
    tbody.appendChild(tr);
  });
}

function buildGradeSelect() {
  const select = document.getElementById('grade-select');
  GRADES.forEach((g, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = g.grade;
    select.appendChild(opt);
  });
  select.addEventListener('change', () => buildSelfCheckList(parseInt(select.value)));
  buildSelfCheckList(0);
}

function buildSelfCheckList(gradeIdx) {
  const container = document.getElementById('self-check-list');
  container.innerHTML = '';
  const grade = GRADES[gradeIdx];
  const saved = loadChecks(LS_SHINSAI + '-' + gradeIdx);

  grade.checks.forEach((check, i) => {
    const li = document.createElement('li');
    li.className = 'flex items-start gap-2';

    const id = `shinsai-${gradeIdx}-${i}`;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.id = id;
    cb.className = 'w-4 h-4 accent-blue-700 mt-0.5 flex-shrink-0';
    cb.checked = saved[id] === true;

    const lbl = document.createElement('label');
    lbl.htmlFor = id;
    lbl.className = 'text-sm text-gray-700 cursor-pointer';
    if (cb.checked) lbl.style.textDecoration = 'line-through';
    lbl.textContent = check;

    cb.addEventListener('change', () => {
      const s = loadChecks(LS_SHINSAI + '-' + gradeIdx);
      s[id] = cb.checked;
      saveChecks(LS_SHINSAI + '-' + gradeIdx, s);
      lbl.style.textDecoration = cb.checked ? 'line-through' : '';
    });

    li.appendChild(cb);
    li.appendChild(lbl);
    container.appendChild(li);
  });
}

// ===== タブ切り替え =====

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      tabs.forEach(t => {
        t.classList.remove('tab-active');
        t.classList.add('tab-inactive');
        t.setAttribute('aria-selected', 'false');
      });
      tab.classList.add('tab-active');
      tab.classList.remove('tab-inactive');
      tab.setAttribute('aria-selected', 'true');
      Object.entries(panels).forEach(([k, el]) => {
        el.classList.toggle('hidden', k !== target);
      });
    });
  });
}

// ===== リセット =====
function setupResets() {
  document.getElementById('reset-reihoh').addEventListener('click', () => {
    localStorage.removeItem(LS_REIHOH);
    document.querySelectorAll('#tab-reihoh input[type="checkbox"]').forEach(cb => {
      cb.checked = false;
      const lbl = document.querySelector('label[for="' + cb.id + '"]');
      if (lbl) lbl.style.textDecoration = '';
    });
  });

  document.getElementById('reset-shahho').addEventListener('click', () => {
    localStorage.removeItem(LS_SHAHHO);
    document.querySelectorAll('#shahho-list input[type="checkbox"]').forEach(cb => {
      cb.checked = false;
      const lbl = document.querySelector('label[for="' + cb.id + '"]');
      if (lbl) lbl.style.textDecoration = '';
    });
  });

  document.getElementById('reset-shinsai').addEventListener('click', () => {
    GRADES.forEach((_, i) => localStorage.removeItem(LS_SHINSAI + '-' + i));
    buildSelfCheckList(parseInt(document.getElementById('grade-select').value));
  });
}
